name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Docker è preinstallato su ubuntu-latest: i test Testcontainers
      # avviano un PostgreSQL reale senza configurazione aggiuntiva.
      - name: Build and test
        run: ./mvnw -B verify

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t siwtheatre:ci .
