<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pagina non trovata</title>
    <div th:replace="~{fragments :: Stylesheet}"></div>
</head>
<body>
    <div class="wrapper d-flex flex-column min-vh-100 justify-content-center align-items-center text-center">
        <h1 class="display-1 fw-bolder text-red">404</h1>
        <h2 class="fw-bold">Pagina non trovata</h2>
        <p class="lead" th:text="${errorMessage} ?: 'La risorsa che stai cercando non esiste o è stata rimossa.'"></p>
        <a href="/" class="btn btn-danger btn-lg mt-3">Torna alla home</a>
    </div>
</body>
</html>
