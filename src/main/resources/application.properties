#==================================
# = Datasource
#==================================
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/siwTheatre}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
#==================================
# = Web server
#==================================
server.port=8080
#server.error.whitelabel.enabled=false
#server.error.include-stacktrace=always
#==================================
# = Messages
#==================================
spring.messages.basename=messages/messages
spring.messages.encoding=ISO-8859-1
#==================================
# = Thymeleaf configurations
#==================================
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
#==================================
# = Auth
# I secret NON vanno mai committati: arrivano da variabili d'ambiente
# (vedi .env.example). I default "changeme" permettono l'avvio senza
# credenziali OAuth reali: il login con form funziona comunque.
#==================================
#==========GOOGLE===================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=profile, email
#=======Facebook===============
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:changeme}
#=======Github===============
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.github.scope=user:email, read:user
